<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Kon Kurs</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#5b6475;--line:#dde1e8;--accent:#1f5fbf;--accent-soft:#e6eefb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--ink:#e7eaf0;--muted:#9aa3b3;--line:#2d3441;--accent:#6ea2ff;--accent-soft:#1d2b45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 16px 60px}
h1{font-size:1.8rem;margin:0 0 .2em}
.lead{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.unit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
a.unit:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.unit.soon{opacity:.6}
.nr{font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.unit h2{font-size:1.1rem;margin:4px 0 0}
.unit p{margin:0;color:var(--muted);font-size:.92rem}
.meta{font-size:.8rem;color:var(--muted);margin-top:auto;padding-top:8px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <h1>KI-Kon · Künstliche Intelligenz Konzepte</h1>
  <p class="lead">Fachschule für Techniker · Rudolf-Diesel-Fachschule Nürnberg. Wählt die Einheit, die im Unterricht dran ist.</p>
  <div class="grid" id="units"></div>
</main>
<footer>Eure Antworten werden nur in diesem Browser gespeichert. Gebt am Ende jeder Einheit den Laufzettel als PDF ab.</footer>
<script>
/* ============================================================
   NEUE EINHEIT ERGÄNZEN: einfach einen Eintrag in diese Liste
   kopieren und anpassen. "ordner" = Name des Unterordners im
   Repository. Ohne "ordner" erscheint die Einheit als "folgt".
   ============================================================ */
const EINHEITEN = [
  { nr: "B 1", titel: "Der KI-Zyklus",
    text: "KI-Werkstatt Predictive Maintenance: Daten prüfen, selbst KI sein, ein Modell trainieren, testen und in Betrieb nehmen.",
    dauer: "ca. 5–6 Unterrichtsstunden", ordner: "b1-ki-zyklus" },
  { nr: "B 2", titel: "Objekterkennung",
    text: "Eigenes YOLO-Modell mit Label Studio und Google Colab trainieren.",
    dauer: "folgt", ordner: "" },
];
document.getElementById('units').innerHTML = EINHEITEN.map(e => {
  const inner = `<span class="nr">${e.nr}</span><h2>${e.titel}</h2><p>${e.text}</p><span class="meta">${e.dauer}</span>`;
  return e.ordner ? `<a class="unit" href="${e.ordner}/index.html">${inner}</a>` : `<div class="unit soon">${inner}</div>`;
}).join('');
</script>
</body>
</html>
